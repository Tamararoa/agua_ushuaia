[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "agua_ushuaia"
version = "0.0.1"
description = "prediccion de volumen acumulado en cisternas"
authors = [
  { name = "Roa Tamara" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["agua_ushuaia"]
include = ["pyproject.toml", "agua_ushuaia/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["agua_ushuaia"]
force-sort-within-sections = true

